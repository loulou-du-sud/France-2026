<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Training Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#09090f;--surface:#111118;--surf2:#17171e;--ink:#e8e8f2;--muted:#565672;--line:#1d1d2a;--chip:#141420;
  --push:#22c55e;--pull:#a855f7;--abs:#f43f5e;--swim:#3b82f6;--run:#f97316;--skill:#f59e0b;
  --protein:#f97316;--danger:#f43f5e;--ok:#22c55e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--push);
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f0f2f9;--surface:#ffffff;--surf2:#f4f5ff;--ink:#0d0d1a;--muted:#70708a;--line:#e0e0ef;--chip:#e8e8f5;
  --push:#15803d;--pull:#7c3aed;--abs:#e11d48;--swim:#2563eb;--run:#ea580c;--skill:#b45309;
  --protein:#ea580c;--danger:#e11d48;--ok:#15803d;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#09090f;--surface:#111118;--surf2:#17171e;--ink:#e8e8f2;--muted:#565672;--line:#1d1d2a;--chip:#141420;
  --push:#22c55e;--pull:#a855f7;--abs:#f43f5e;--swim:#3b82f6;--run:#f97316;--skill:#f59e0b;
  --protein:#f97316;--danger:#f43f5e;--ok:#22c55e;}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f0f2f9;--surface:#ffffff;--surf2:#f4f5ff;--ink:#0d0d1a;--muted:#70708a;--line:#e0e0ef;--chip:#e8e8f5;
  --push:#15803d;--pull:#7c3aed;--abs:#e11d48;--swim:#2563eb;--run:#ea580c;--skill:#b45309;
  --protein:#ea580c;--danger:#e11d48;--ok:#15803d;}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:40px;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:26px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:4px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:8px 16px;font:700 12px var(--body);cursor:pointer;text-transform:uppercase;letter-spacing:.07em}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tally{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 10px;
  display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.tally::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--tc,transparent)}
.tally .num{font-size:34px;line-height:1;color:var(--tc,var(--accent))}
.tally .of{color:var(--muted);font-size:17px;font-family:var(--display)}
.bar{height:3px;border-radius:2px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
@media(max-width:520px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}.tally .num{font-size:26px}.tally .of{font-size:14px}}
.panel{display:flex;flex-direction:column;gap:14px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surf2);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.kpi .num{font-size:34px;line-height:1.05;color:var(--accent)}
.kpi .unit{font-size:14px;color:var(--muted);margin-left:2px}
.kpi small{color:var(--muted);display:block;font-size:11px}
.kpi small.hit{color:var(--ok)}
.kpi small.close{color:var(--skill)}
.kpi small.miss{color:var(--danger)}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
input,select{font:16px var(--body);color:var(--ink);background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;width:100%;min-width:0;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent);outline:none}
.actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:12px 20px;font:700 14px var(--body);cursor:pointer;background:var(--accent);color:#fff;
  text-transform:uppercase;letter-spacing:.07em}
.btn[disabled]{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.charthead select{width:auto}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:12px var(--body)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.chart .ar{fill:var(--accent);opacity:.08}
svg.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg.chart .last{fill:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .d{font-family:var(--display);font-size:18px;width:52px;flex:0 0 auto;line-height:1.1;text-transform:uppercase}
.hist .d small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.05em}
.hist .b{flex:1;min-width:0}
.hist .b strong{font-weight:600}
.hist .b p{margin:2px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.hist .b strong.hit{color:var(--ok)}
.hist .b strong.miss{color:var(--muted)}
.confirm{display:flex;gap:6px}
.confirm .ghost.del{color:var(--danger);border-color:var(--danger)}
.plan{width:100%;border-collapse:collapse;font-size:14px}
.plan th,.plan td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.plan th{font-family:var(--display);font-size:17px;text-transform:uppercase;width:56px}
.plan thead th{border-top:0;font-size:12px;font-family:var(--body);letter-spacing:.08em;color:var(--muted)}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--chip);margin-right:4px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.status{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.04em}
.blk{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blkhead{display:flex;flex-direction:column;gap:2px}
.blkhead strong{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
table.ex{width:100%;border-collapse:collapse;font-size:14px}
table.ex td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
table.ex tr:first-child td{border-top:0}
table.ex td:last-child{text-align:right;padding-left:12px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.ex tr.grp td{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:12px;text-align:left}
.daytab{padding:6px 12px;font-size:13px}
@media(max-width:420px){table.ex td:last-child{white-space:normal}}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ghead .num{font-size:22px}
.gmeta{margin:0;color:var(--muted);font-size:13px}
.gmeta b{color:var(--ink);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-top:1px solid var(--line);border-radius:6px}
.step:first-child{border-top:0}
.step input{width:20px;height:20px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--gc);padding:0}
.step label{flex:1;min-width:0;cursor:pointer}
.step .when{display:block;font-size:12px;color:var(--muted)}
.step.done label{color:var(--muted)}
.step.next{background:var(--chip);border-top-color:transparent}
.step.next+.step{border-top-color:transparent}
.nexttag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gc);margin-left:6px}
.gbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--gc)}
.sport-picker{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.sport-picker::-webkit-scrollbar{display:none}
.sport-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surf2);color:var(--muted);border-radius:999px;
  padding:8px 16px;font:700 12px var(--body);cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.sport-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pbar-wrap{display:flex;flex-direction:column;gap:6px}
.pbar-track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.pbar-track i{display:block;height:100%;border-radius:5px;background:var(--protein);transition:width .3s}
.pbar-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
textarea{font:16px var(--body);color:var(--ink);background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;width:100%;min-width:0;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.prog-input{font-size:12px;padding:4px 6px;width:auto;min-width:0;max-width:130px}
.prog-cb{width:18px;height:18px;padding:0;cursor:pointer;accent-color:var(--accent)}
.prog-note{font-size:12px;padding:4px 6px;width:100%;min-width:0}
.ex thead td,.ex thead th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-top:0}
.cal-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal-week-label{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;
  font-family:inherit;color:var(--ink)}
.cal-day.today .cal-dn,.cal-day.today .cal-dd{color:var(--accent)}
.cal-day.today{border-color:var(--accent)}
.cal-day.sel{background:var(--accent);border-color:var(--accent)}
.cal-day.sel .cal-dn,.cal-day.sel .cal-dd,.cal-day.sel .cal-rest{color:#fff!important}
.cal-day.sel .cal-dot{background:rgba(255,255,255,.65)!important}
.cal-day.rest{opacity:.4}
.cal-dn{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);line-height:1}
.cal-dd{font-family:var(--display);font-size:22px;line-height:1;font-weight:700}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-rest{font-size:11px;color:var(--muted);line-height:1;margin-top:2px}
@media(max-width:420px){.cal-day{padding:8px 2px 6px}.cal-dd{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.tab,.btn,.sport-chip,.cal-day{transition:background .12s,border-color .12s}}
.confirm-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.confirm-row:first-of-type{border-top:0}
.confirm-day{width:50px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px}
.confirm-dn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.confirm-dd{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.confirm-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.confirm-info strong{font-family:var(--display);font-size:17px;text-transform:uppercase;font-weight:700;letter-spacing:.02em}
.confirm-dur{font-size:12px;color:var(--muted);font-weight:500}
.confirm-check{flex:0 0 auto;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;user-select:none}
.confirm-check input[type=checkbox]{width:24px;height:24px;cursor:pointer;border-radius:6px;accent-color:var(--ok);flex:0 0 auto}
.confirm-row.done .confirm-check{color:var(--ok)}
.confirm-row.today .confirm-dd,.confirm-row.today .confirm-dn{color:var(--accent)}
.confirm-row.today{border-top-color:transparent}
.confirm-row.today+.confirm-row{border-top-color:transparent}
.confirm-today-bg{background:var(--surf2);border-radius:10px;padding:12px;margin:-2px 0}

</style>

<div class="wrap">
  <header>
    <h1>Training Log</h1>
    <p class="sub" id="weeklabel">This week</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view" class="panel"></main>
  <p class="status" id="status"></p>
</div>

<script>
const SPORTS = {
  push:{name:"Push & dips",color:"--push",planned:2,
    fields:[
      {k:"pushups",l:"Push-ups (best set)",t:"number",step:"1",min:"0"},
      {k:"knee",l:"Knee push-ups (best set)",t:"number",step:"1",min:"0"},
      {k:"dips",l:"Dips (best set)",t:"number",step:"1",min:"0"},
      {k:"support",l:"Dip support hold (seconds)",t:"number",step:"1",min:"0"},
      {k:"rounds",l:"Circuit rounds done",t:"number",step:"1",min:"0"}],
    metrics:[{k:"pushups",l:"Push-ups",u:"reps",better:"high"},{k:"dips",l:"Dips",u:"reps",better:"high"},{k:"support",l:"Support hold",u:"s",better:"high"},{k:"knee",l:"Knee push-ups",u:"reps",better:"high"}],
    kpis:d=>[
      ["Push-ups",best(d,"pushups"),"reps","Goal: 5 × 20"],
      ["Dips",best(d,"dips"),"reps","Start with support holds"],
      ["Rounds",best(d,"rounds"),"","Move to 3 when 2 feel easy"]],
    summary:x=>[x.pushups!=null?x.pushups+" push-ups":"",x.knee?x.knee+" knee":"",x.dips!=null?x.dips+" dips":"",x.support?x.support+" s hold":"",x.rounds?x.rounds+" rounds":""],
    tip:"Monday and Friday. You're currently at 5 × 6–7 — start at 5 × 8 this session. Rule: when you complete all 5 sets with good form, add 2 reps to every set next time. Rest 90–120 s between sets. At 5 × 20 you're done."},
  pull:{name:"Pull-ups",color:"--pull",planned:2,
    fields:[
      {k:"hang",l:"Dead hang (seconds)",t:"number",step:"1",min:"0"},
      {k:"rows",l:"Rows (best set reps)",t:"number",step:"1",min:"0"},
      {k:"reps",l:"Main exercise reps",t:"number",step:"1",min:"0"},
      {k:"notes",l:"Notes (phase, feel)",t:"text"}],
    metrics:[{k:"hang",l:"Dead hang",u:"s",better:"high"},{k:"rows",l:"Rows",u:"reps",better:"high"},{k:"reps",l:"Main exercise",u:"reps",better:"high"}],
    kpis:d=>[
      ["Dead hang",best(d,"hang"),"s","Goal: 60 s"],
      ["Rows",best(d,"rows"),"reps","Goal: 3 × 15"],
      ["Main exercise",best(d,"reps"),"reps","Goal: 3 × 10 strict"]],
    summary:x=>[x.hang?x.hang+" s hang":"",x.rows?x.rows+" rows":"",x.reps?x.reps+" reps":"",x.notes||""],
    tip:"Tuesday and Thursday. Dead hang and rows every session throughout all phases."},
  abs:{name:"Abs",color:"--abs",planned:1,
    fields:[
      {k:"rounds",l:"Rounds done",t:"number",step:"1",min:"0"},
      {k:"work",l:"Work interval",t:"select",o:["30","45"]},
      {k:"plank",l:"Plank hold (seconds)",t:"number",step:"1",min:"0"},
      {k:"done",l:"Exercises finished (of 10)",t:"number",step:"1",min:"0",max:"10"}],
    metrics:[{k:"plank",l:"Plank hold",u:"s",better:"high"},{k:"done",l:"Exercises finished",u:"/10",better:"high"},{k:"rounds",l:"Rounds",u:"",better:"high"}],
    kpis:d=>[
      ["Plank hold",best(d,"plank"),"s","Test every 4 weeks"],
      ["Interval",d.some(x=>x.work==="45")?"45":d.length?"30":"—","s","Switch to 45 s after week 2"],
      ["Sessions",d.length,"","Tuesday and Friday"]],
    summary:x=>[x.rounds?x.rounds+" round"+(x.rounds>1?"s":""):"",x.work?x.work+" s on":"",x.done!=null?x.done+"/10 finished":"",x.plank?x.plank+" s plank":""],
    tip:"Lift your chest toward the ceiling rather than crushing it toward your knees."},
};
SPORTS.rope={name:"Jump rope",color:"--swim",planned:1,
  fields:[
    {k:"minutes",l:"Minutes jumping (total)",t:"number",step:"0.5",min:"0"},
    {k:"streak",l:"Longest without a miss (seconds)",t:"number",step:"1",min:"0"},
    {k:"rounds",l:"Rounds done",t:"number",step:"1",min:"0"}],
  metrics:[{k:"streak",l:"Longest without a miss",u:"s",better:"high"},{k:"minutes",l:"Minutes jumping",u:"min",better:"high"}],
  kpis:d=>{const m=monthOf(d);return[
    ["Longest no-miss",best(d,"streak"),"s","Aim for 5 min non-stop"],
    ["Best session",best(d,"minutes"),"min","Total time jumping"],
    ["This month",fmt1(m.reduce((a,x)=>a+(x.minutes||0),0)),"min",m.length+" sessions"]]},
  summary:x=>[x.minutes?fmt1(x.minutes)+" min":"",x.rounds?x.rounds+" rounds":"",x.streak?x.streak+" s without a miss":""],
  tip:"Tuesday and Thursday mornings. Small jumps on the balls of your feet. Skip it if your shins or calves hurt from running."};
SPORTS.body={name:"Body",color:"--skill",planned:0,noBoard:true,
  fields:[
    {k:"weight",l:"Weight (kg)",t:"number",step:"0.1",min:"0"},
    {k:"arm",l:"Upper arm, flexed (cm)",t:"number",step:"0.1",min:"0"},
    {k:"chest",l:"Chest (cm)",t:"number",step:"0.1",min:"0"},
    {k:"waist",l:"Waist at the navel (cm)",t:"number",step:"0.1",min:"0"},
    {k:"thigh",l:"Thigh (cm)",t:"number",step:"0.1",min:"0"}],
  metrics:[{k:"weight",l:"Weight",u:"kg",better:"high"},{k:"arm",l:"Upper arm",u:"cm",better:"high"},{k:"chest",l:"Chest",u:"cm",better:"high"},{k:"waist",l:"Waist",u:"cm",better:"low"},{k:"thigh",l:"Thigh",u:"cm",better:"high"}],
  kpis:d=>{const ch=k=>{const a=d.filter(x=>typeof x[k]==="number");if(!a.length)return["—",""];const v=a[a.length-1][k],dv=v-a[0][k];
      return[fmt1(v),a.length>1?(dv>=0?"+":"")+fmt1(dv)+" since "+new Date(a[0].date+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"First measurement"]};

function drawProteinChart(pts){
  const target=PROTEIN_TARGET;
  const W=600,H=220,L=48,R=24,T=14,B=30;
  const NS="http://www.w3.org/2000/svg";
  const v=pts.map(x=>x.grams);

  const pad=(hi-lo)*.1;lo-=pad;hi+=pad;if(lo<0)lo=0;
  const y=val=>H-B-(val-lo)/(hi-lo)*(H-T-B);
  const x=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1));
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","chart");
  svg.setAttribute("role","img");svg.setAttribute("aria-label","Protein intake over "+pts.length+" days");
  const add=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const[k,val]of Object.entries(a))e.setAttribute(k,val);if(txt!=null)e.textContent=txt;svg.append(e);return e};
  for(let i=0;i<=3;i++){const val=lo+(hi-lo)*i/3;const yy=y(val);add("line",{class:"grid",x1:L,x2:W-R,y1:yy,y2:yy});add("text",{x:L-8,y:yy+4,"text-anchor":"end"},Math.round(val))}

  add("text",{x:W-R+4,y:ty+4,"text-anchor":"start","font-size":"11","fill":"var(--protein)"},target+"g");
  const line=pts.map((p,i)=>`${x(i)},${y(p.grams)}`).join(" ");
  add("polygon",{class:"ar",points:`${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`});
  add("polyline",{class:"ln",points:line});
  pts.forEach((p,i)=>add("circle",{class:i===pts.length-1?"last":"dot",cx:x(i),cy:y(p.grams),r:i===pts.length-1?5:3.5}));
  const fd=s=>new Date(s+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  add("text",{x:L,y:H-8,"text-anchor":"start"},fd(pts[0].date));
  add("text",{x:W-R,y:H-8,"text-anchor":"end"},fd(pts[pts.length-1].date));
  const last=pts[pts.length-1].grams;
  return el("div",{},svg,el("p",{class:"msg",style:"margin:6px 0 0"},"Latest: "+last+" g · Target: "+target+" g · Dashed line = target"));
}

// ── localStorage database shim ────────────────────────────────────────────────
(function(){
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function readCol(n){return lsGet('lsdb:c:'+n)||{}}
  function writeCol(n,d){lsSet('lsdb:c:'+n,d)}
  function readDoc(p){return lsGet('lsdb:d:'+p)}
  function writeDoc(p,d){lsSet('lsdb:d:'+p,d)}
  function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  const colCbs={};const docCbs={};
  function colSnap(name,field,dir){
    const data=readCol(name);
    let docs=Object.entries(data).map(([id,d])=>({id,data:()=>Object.assign({},d)}));
    if(field)docs.sort((a,b)=>{const av=a.data()[field],bv=b.data()[field];const c=av<bv?-1:av>bv?1:0;return dir==='desc'?-c:c});
    return{docs,metadata:{fromCache:false}}}
  function fireCol(name){(colCbs[name]||[]).forEach(({cb,field,dir})=>{try{cb(colSnap(name,field,dir))}catch(e){}})}
  function fireDoc(path){const data=readDoc(path);const snap={exists:data!==null,data:()=>Object.assign({},data||{})};(docCbs[path]||[]).forEach(cb=>{try{cb(snap)}catch(e){}})}
  const lsdb={
    collection(name){
      let _f=null,_d='asc';
      const ref={
        orderBy(f,d){_f=f;_d=d||'asc';return ref},
        onSnapshot(cb,errCb){
          if(!colCbs[name])colCbs[name]=[];
          colCbs[name].push({cb,field:_f,dir:_d});
          cb(colSnap(name,_f,_d))},
        add(doc){const id=genId();const col=readCol(name);col[id]=doc;writeCol(name,col);fireCol(name);return Promise.resolve({id})},
        doc(id){return{
          set(data){const col=readCol(name);col[id]=data;writeCol(name,col);fireCol(name);return Promise.resolve()},
          delete(){const col=readCol(name);delete col[id];writeCol(name,col);fireCol(name);return Promise.resolve()}}}};
      return ref},
    doc(path){return{
      set(data){writeDoc(path,data);fireDoc(path);return Promise.resolve()},
      onSnapshot(cb,errCb){
        if(!docCbs[path])docCbs[path]=[];
        docCbs[path].push(cb);
        const data=readDoc(path);
        cb({exists:data!==null,data:()=>Object.assign({},data||{})})}}}};
  db=lsdb;canWrite=true;
  const st=document.getElementById("status");
  db.collection("logs").orderBy("date","asc").onSnapshot(snap=>{
    logs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache)st.textContent=logs.filter(x=>x.sport!=="body").length?logs.filter(x=>x.sport!=="body").length+" sessions logged.":"";
    render()},()=>{});
  db.doc("settings/program").onSnapshot(s=>{if(s.exists&&s.data().start){programStart=s.data().start;render()}},()=>{});
  db.collection("goals").onSnapshot(snap=>{const g={};snap.docs.forEach(d=>{g[d.id]=d.data()});goalsData=g;render()},()=>{});
  db.collection("exercise_progress").onSnapshot(snap=>{const p={};snap.docs.forEach(d=>{p[d.id]=d.data()});progressData=p;render()},()=>{});
})()
